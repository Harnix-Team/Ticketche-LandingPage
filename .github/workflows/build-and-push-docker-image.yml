name: Build & push docker image

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after pushing the image?"
        type: boolean
        default: true

env:
  APP_URL: https://ticketche.com
  API_URL: https://api.ticketche.com
  DEPLOY_FOLDER: /root/app/ticketche

concurrency:
  group: build-and-push-docker-image
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get app version
        run: |
          APP_VERSION=$(jq -r .version package.json)
          echo "TAG=$APP_VERSION" >> $GITHUB_ENV
          echo "TAG=$APP_VERSION"

      - name: Create .env file and set client vars only
        run: |
          cp .env.example .env
          sed -i "s|NODE_ENV=.*|NODE_ENV=production|" .env
          sed -i "s|NEXT_PUBLIC_APP_URL=.*|NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}|" .env
          sed -i "s|NEXT_PUBLIC_API_URL=.*|NEXT_PUBLIC_API_URL=${{ env.API_URL }}|" .env

      - name: Set lowercase registry owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/ticketche-landing-page:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/ticketche-landing-page:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "## Image publiée — ticketche-landing-page" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`ghcr.io\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ env.OWNER }}/ticketche-landing-page\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ env.TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branche | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| App URL | ${{ env.APP_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags poussés :**" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.OWNER }}/ticketche-landing-page:${{ env.TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.OWNER }}/ticketche-landing-page:latest\`" >> $GITHUB_STEP_SUMMARY
  
  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    needs: build-and-push
    if: inputs.deploy == true

    steps:
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "❌ Error: VPS_HOST secret is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "❌ Error: VPS_USER secret is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ Error: VPS_SSH_KEY secret is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_PASSPHRASE }}" ]; then
            echo "❌ Error: SSH_PASSPHRASE secret is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "❌ Error: GHCR_TOKEN secret is not defined"
            exit 1
          fi
          echo "✅ All required secrets are defined"

      - name: Pull latest images on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 15m
          script: |
            set -e
            echo "Logging in to GitHub Container Registry..."
            OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u $OWNER --password-stdin

            echo "Pulling latest landing page image..."
            docker pull ghcr.io/${OWNER}/ticketche-landing-page:latest
            
            echo "Restarting landing page container with new image..."
            for env in prod dev; do
              cd ${{ env.DEPLOY_FOLDER }}/$env/INFRA
              docker compose -p ticketche-${env} -f docker-compose.${env}.yml up -d --remove-orphans --force-recreate ticketche-${env}-landing-page
            done

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Déploiement terminé — ticketche-landing-page" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Serveur | VPS |" >> $GITHUB_STEP_SUMMARY
          echo "| Environnements | prod, dev |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ secrets.REGISTRY_OWNER || github.repository_owner }}/ticketche-landing-page:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branche | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY

              