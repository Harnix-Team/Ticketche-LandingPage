name: Build & push docker image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement a construire et deployer"
        type: choice
        options:
          - dev
          - prod
          - both
        default: dev
      deploy:
        description: "Deploy after pushing the image?"
        type: boolean
        default: true

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"
  DEPLOY_FOLDER: /root/app/ticketche

concurrency:
  group: build-and-push-docker-image-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  setup-matrix:
    name: Resolve environments
    runs-on: self-hosted
    outputs:
      environments: ${{ steps.set.outputs.environments }}
    steps:
      - id: set
        run: |
          case "${{ inputs.environment }}" in
            both) echo 'environments=["prod","dev"]' >> "$GITHUB_OUTPUT" ;;
            prod) echo 'environments=["prod"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'environments=["dev"]' >> "$GITHUB_OUTPUT" ;;
          esac

  build-and-push:
    name: Build & push frontend image (${{ matrix.env }})
    runs-on: self-hosted
    needs: setup-matrix
    environment: ${{ matrix.env }}
    strategy:
      matrix:
        env: ${{ fromJson(needs.setup-matrix.outputs.environments) }}
      fail-fast: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Isolate Docker credentials
        # Les runners self-hosted du VPS partagent ~/.docker/config.json : le
        # login/logout d'un job d'un autre repo ecraserait nos identifiants en
        # cours de build (unauthenticated / write_package denied aleatoires).
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          if [ -d "$HOME/.docker/cli-plugins" ]; then
            ln -sfn "$HOME/.docker/cli-plugins" "$RUNNER_TEMP/docker-config/cli-plugins"
          fi
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve environment settings
        # Les NEXT_PUBLIC_* sont figees au build : une image par environnement.
        run: |
          APP_VERSION=$(jq -r .version package.json)
          if [ "${{ matrix.env }}" = "prod" ]; then
            echo "TAG=$APP_VERSION" >> $GITHUB_ENV
            echo "FLOATING_TAG=latest" >> $GITHUB_ENV
            echo "APP_URL=https://ticketche.com" >> $GITHUB_ENV
            echo "API_URL=https://api.ticketche.com/api/v2" >> $GITHUB_ENV
          else
            echo "TAG=dev-$APP_VERSION" >> $GITHUB_ENV
            echo "FLOATING_TAG=dev" >> $GITHUB_ENV
            echo "APP_URL=https://dev.ticketche.com" >> $GITHUB_ENV
            echo "API_URL=https://dev.api.ticketche.com/api/v2" >> $GITHUB_ENV
          fi

      - name: Create .env file and set client vars only
        run: |
          cp .env.example .env
          sed -i "s|NODE_ENV=.*|NODE_ENV=production|" .env
          sed -i "s|NEXT_PUBLIC_APP_URL=.*|NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}|" .env
          sed -i "s|NEXT_PUBLIC_API_URL=.*|NEXT_PUBLIC_API_URL=${{ env.API_URL }}|" .env

      - name: Set lowercase registry owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (lecture, pull des images de base mirrorees)
        # GHCR_TOKEN lit tout package prive de l'org (mirror-node appartient
        # a un autre repo), mais n'a pas les droits d'ecriture - "permission_
        # denied: token does not match expected scopes" au push avec ce
        # token. D'ou le re-login GITHUB_TOKEN juste avant push plus bas.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build frontend image (sans push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ghcr.io/${{ env.OWNER }}/ticketche-landing-page:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/ticketche-landing-page:${{ env.FLOATING_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR (ecriture, push de l'image de ce repo)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push frontend image
        run: |
          set -e
          docker push ghcr.io/${{ env.OWNER }}/ticketche-landing-page:${{ env.TAG }}
          docker push ghcr.io/${{ env.OWNER }}/ticketche-landing-page:${{ env.FLOATING_TAG }}

      - name: Summary
        if: always()
        run: |
          echo "## Image publiée — ticketche-landing-page" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`ghcr.io\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ env.OWNER }}/ticketche-landing-page\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ env.TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branche | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| App URL | ${{ env.APP_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags poussés :**" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.OWNER }}/ticketche-landing-page:${{ env.TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.OWNER }}/ticketche-landing-page:${{ env.FLOATING_TAG }}\`" >> $GITHUB_STEP_SUMMARY
  
  deploy:
    name: Deploy on VPS (${{ matrix.env }})
    runs-on: self-hosted
    environment: ${{ matrix.env }}
    permissions:
      contents: read
    needs: [setup-matrix, build-and-push]
    if: inputs.deploy == true
    strategy:
      matrix:
        env: ${{ fromJson(needs.setup-matrix.outputs.environments) }}
      fail-fast: false

    steps:
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "❌ Error: VPS_HOST secret is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "❌ Error: VPS_USER secret is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ Error: VPS_SSH_KEY secret is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_PASSPHRASE }}" ]; then
            echo "❌ Error: SSH_PASSPHRASE secret is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "❌ Error: GHCR_TOKEN secret is not defined"
            exit 1
          fi
          echo "✅ All required secrets are defined"

      - name: Pull latest images on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 15m
          script: |
            set -e
            echo "Logging in to GitHub Container Registry..."
            OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u $OWNER --password-stdin

            echo "Pulling latest landing page image..."
            if [ "${{ matrix.env }}" = "prod" ]; then TAG=latest; else TAG=dev; fi
            docker pull ghcr.io/${OWNER}/ticketche-landing-page:${TAG}

            echo "Restarting landing page container with new image..."
            cd ${{ env.DEPLOY_FOLDER }}/${{ matrix.env }}/INFRA
            docker compose -p ticketche-${{ matrix.env }} -f docker-compose.${{ matrix.env }}.yml up -d --remove-orphans --force-recreate ticketche-${{ matrix.env }}-landing-page

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Déploiement terminé — ticketche-landing-page" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Serveur | VPS |" >> $GITHUB_STEP_SUMMARY
          echo "| Environnement | ${{ matrix.env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ secrets.REGISTRY_OWNER || github.repository_owner }}/ticketche-landing-page:${{ matrix.env == 'prod' && 'latest' || 'dev' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branche | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY

              